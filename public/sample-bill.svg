<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Sample municipal electricity bill</title>
  <desc id="desc">Demo statement for account JHB-4471-0093, September 2026, total due R3,107.00. Not a real municipal document.</desc>
  <rect width="720" height="980" fill="#f4f0e6"/>
  <rect x="0" y="0" width="720" height="132" fill="#143028"/>
  <text x="48" y="58" fill="#d7f5e8" font-family="ui-sans-serif, sans-serif" font-size="14" letter-spacing="2">UBUNTU DESK - DEMO BILL</text>
  <text x="48" y="96" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="28" font-weight="700">Municipal electricity account</text>
  <text x="48" y="176" fill="#5c6570" font-family="ui-sans-serif, sans-serif" font-size="13">Not a live municipal statement. Simulated OCR reads the lines below.</text>
  <text x="48" y="230" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Account holder: N. Dlamini</text>
  <text x="48" y="268" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Account no. JHB-4471-0093</text>
  <text x="48" y="306" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Billing period: 2026-09</text>
  <text x="48" y="344" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Ward: Ward 112, Soweto</text>
  <line x1="48" y1="380" x2="672" y2="380" stroke="#d5d0c4"/>
  <text x="48" y="424" fill="#5c6570" font-family="ui-sans-serif, sans-serif" font-size="13">METER</text>
  <text x="48" y="456" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Conventional - tariff RES-STD-2026</text>
  <text x="48" y="494" fill="#1c2430" font-family="ui-sans-serif, sans-serif" font-size="18">Consumption: 1020 kWh</text>
  <text x="48" y="532" fill="#8a3b2a" font-family="ui-sans-serif, sans-serif" font-size="18">Estimated: yes</text>
  <text x="48" y="570" fill="#5c6570" font-family="ui-sans-serif, sans-serif" font-size="15">July actual 410 kWh - August actual 395 kWh</text>
  <rect x="48" y="620" width="624" height="150" rx="16" fill="#143028"/>
  <text x="72" y="668" fill="#b7d7c8" font-family="ui-sans-serif, sans-serif" font-size="14">AMOUNT ON THIS SAMPLE</text>
  <text x="72" y="724" fill="#ffffff" font-family="ui-sans-serif, sans-serif" font-size="36" font-weight="700">Total due R3,107.00</text>
  <text x="48" y="820" fill="#5c6570" font-family="ui-sans-serif, sans-serif" font-size="14">Demo tariff used later by Ubuntu Desk: R3.05 per kWh, blended.</text>
  <text x="48" y="852" fill="#5c6570" font-family="ui-sans-serif, sans-serif" font-size="14">Clause cited in the demo: 14.3 estimated consumption, 20% cap.</text>
  <text x="48" y="920" fill="#8a3b2a" font-family="ui-sans-serif, sans-serif" font-size="13">SAMPLE ONLY - do not pay - not issued by a municipality</text>
</svg>
